# Security headers for files Netlify serves straight from its CDN: JS/CSS chunks, optimised
# images and the files in /public. Pages get theirs (plus a Content-Security-Policy) from
# next.config.ts. Build settings stay in the Netlify dashboard; this file only adds headers.

[[headers]]
  for = "/_next/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/.netlify/images"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/brand/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/slide/*"
  [headers.values]
